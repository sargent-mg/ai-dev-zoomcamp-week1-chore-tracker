<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Chore Tracker{% endblock %}</title>
    <style>
        body { font-family: sans-serif; max-width: 40rem; margin: 0 auto; padding: 1rem; }
        nav { margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #ccc; }
        nav a { margin-right: 1rem; }
        form { margin-bottom: 1rem; }
        li { margin-bottom: 0.5rem; }
        button, input, select { font-size: 1rem; padding: 0.3rem 0.6rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #eee; }
        .table-wrap { overflow-x: auto; }
    </style>
</head>
<body>
    {% include "chores/_nav.html" %}
    {% block content %}{% endblock %}
</body>
</html>
